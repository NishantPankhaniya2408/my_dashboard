<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <style>
        label,input {
                animation-duration: 1s;
                -moz-animation-duration: 1s;
                -webkit-animation-duration: 3s;
                animation-name: slidein;
                -moz-animation-name: slidein;
                -webkit-animation-name: slidein;
}
            @keyframes slidein {
        from {
            margin-left:100%;
            width:100%
            }
            to {
            margin-left:0%;
            width:100%;
            }
            }
            @-moz-keyframes slidein {
            from {
            margin-left:100%;
            width:300%
            }
            to {
            margin-left:0%;
            width:100%;
            }
            }
            @-webkit-keyframes slidein {
        from {
        margin-left:100%;
        width:300%
        }
        to {
        margin-left:0%;
        width:100%;
        }
        }
       @keyframes flip {
    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(360deg);
    }
}

h1 {
    animation: flip 2s;
}
@keyframes fadeout {
    from {
        opacity: 1;
    }
    to {
        opacity: 0;
    }
}

p {
    animation: fadeout 2s;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1>Create Account  </h1>
    <p class="subtitle">Register your account</p>
    <form id="registerForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
            <small id="nameError"></small>
        </div>
       
        <div class="form-group">
            <label for="mobile">Mobile</label>
            <input type="text" id="tel " maxlength="10" placeholder="Enter 10 digit mobile number" required>
            <small id="mobileError"></small>
        </div>

        <div class="form-group">
            <label for="email">Email id</label>
            <input type="text" id="email" placeholder="Enter your email" required >
             <small id="emailerror"></small>
        </div>
        
        <div class="form-group">
            <label for="aadharcard">AadharCard No.</label>
            <input type="text" id="aadharcard" minlength="12" maxlength="12"  placeholder="Enter Aadharcard number" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="text" id="password" placeholder="Enter your Password" required>
            <small id="passworderror"></small>
        </div>
        <div class="form-group">
            <label for="confirmpassword">Confirm Password</label>
            <input type="text" id="confirmpassword" placeholder="Confirm Password" required>
            <small id="confirmpassworderror"></small>
        </div>
        
        <div class="form-group">
            <label>Gender</label>
                <div class="radio-group" >           
                    <label>
                    <input type="radio" name="gender" value="Male" required >Male
                    </label>
                    <label>
                    <input type="radio" name="gender" value="Female"  required>Female
                    </label>
                    <input type="radio" name="gender" value="other"  required>Other
                </label>
            </div>
             <small id="genderError"></small>
        </div>
        <div class="form-group">
            <label>Hobbies</label>
            <div class="checkbox-group">
                <label>
                <input type="checkbox" name="hobby" value="Reading" />Reading
                </label>
                <label>
                <input type="checkbox" name="hobby" value="Sport" />Sport
                </label>
                <label>
                <input type="checkbox" name="hobby" value="Writing" />Writing
                </label>
                <label>
                <input type="checkbox" name="hobby" value="Music" />Music
                </label>
                <label>
                <input type="checkbox" name="hobby" value="Travel" />Travel
                </label>
            </div>
            <small id="checkboxerror"></small>
        </div>
        
        <button type="submit" class="btn">Register</button>
        <p class="bottom-text"> 
            Already have an account? <a href="login.html">Login</a>
        </p>
    </form>
        </div>
    </div>
</body>
</html>
